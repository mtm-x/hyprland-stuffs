include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

# remap to open new kitty tab in the same directory (default is home dir)
map ctrl+shift+t            new_tab_with_cwd
map ctrl+shift+enter        combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+shift+b            combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+h            neighboring_window left
map ctrl+shift+j            neighboring_window bottom
map ctrl+shift+k            neighboring_window top
map ctrl+shift+l	    neighboring_window right
map ctrl+shift+semicolon    next_layout
map ctrl+alt+h              resize_window narrower 5
map ctrl+alt+j              resize_window shorter 5
map ctrl+alt+k              resize_window taller 5
map ctrl+alt+l              resize_window wider 5

# opens yazi in the current path
map ctrl+f send_text all yazi\r

map ctrl+shift+x toggle_layout stack

map ctrl+z scroll_to_prompt -1
map ctrl+x scroll_to_prompt 1

map f2 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

map ctrl+shift+d launch --location=vsplit dmesg -wH

map ctrl+shift+g launch --stdin-source=@last_visited_cmd_output --type=clipboard

map ctrl+shift+space kitten kitty_grab/grab.py
mouse_map right press ungrabbed mouse_select_command_output
