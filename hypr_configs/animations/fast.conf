# ----------------------------------------------------- 
# Fast & Responsive Animations
# ----------------------------------------------------- 
animations {
    enabled = true
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeInCubic, 0.32, 0, 0.67, 0
    bezier = md3_decel, 0.05, 0.7, 0.1, 1

    # Windows opening, closing, and moving (Fast & Snappy)
    animation = windows, 1, 2.5, md3_decel, popin 80%
    animation = windowsIn, 1, 2.2, md3_decel, popin 80%
    animation = windowsOut, 1, 1.8, easeInCubic, popin 80%
    animation = windowsMove, 1, 2.5, md3_decel, slide

    # Fading & Workspace switching
    animation = fade, 1, 2, md3_decel
    animation = fadeIn, 1, 2, md3_decel
    animation = fadeOut, 1, 1.5, md3_decel
    animation = workspaces, 1, 2.8, easeOutCubic, slide
    animation = specialWorkspace, 1, 2.5, md3_decel, slidevert

    # Borders
    animation = border, 1, 1, default
    animation = borderangle, 1, 30, default
}